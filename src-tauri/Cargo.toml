[package]
name = "unnamed-desktop-app"
version = "0.1.0"
description = "Unnamed Windows Desktop App"
authors = ["notLimitedRBX"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
