name: Build X1 mouse gallery and UI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/x1-gallery-and-ui.yml

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image and UI tools
        run: |
          python -m pip install --disable-pip-version-check pillow beautifulsoup4 requests rembg onnxruntime

      - name: Download white X1 mouse-only images and remove backgrounds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO
          from rembg import remove

          page_url = 'https://attackshark.com/products/attack-shark-x1-wireless-gaming-mouse-with-magnetic-charging-dock-paw3395pro'
          headers = {'User-Agent': 'Mozilla/5.0'}
          html = requests.get(page_url, headers=headers, timeout=30).text
          soup = BeautifulSoup(html, 'html.parser')

          excluded = ('dock', 'charging', 'black', 'red', 'purple', 'driver', 'software', 'parameter', 'grip tape', 'with tape', 'receiver', 'cable')
          candidates = []
          for img in soup.find_all('img'):
              alt = (img.get('alt') or '').lower()
              if 'x1' not in alt or 'mouse' not in alt or 'white' not in alt:
                  continue
              if any(word in alt for word in excluded):
                  continue
              src = img.get('src') or img.get('data-src') or img.get('data-original')
              if not src and img.get('srcset'):
                  src = img.get('srcset').split(',')[-1].strip().split(' ')[0]
              if not src:
                  continue
              url = urljoin(page_url, src).replace('&amp;', '&')
              if url not in candidates:
                  candidates.append(url)

          if not candidates:
              candidates = ['https://games4u.pk/cdn/shop/files/attack_shark_2_234a69ba-7cb3-492a-8468-13c703d7fd56.jpg?v=1775740412&width=800']

          out_dir = Path('public/assets/x1')
          out_dir.mkdir(parents=True, exist_ok=True)
          for old in out_dir.glob('attack-shark-x1-*.png'):
              old.unlink()
          saved = []

          for url in candidates:
              try:
                  response = requests.get(url, headers=headers, timeout=30)
                  response.raise_for_status()
                  # rembg.remove expects the encoded source image bytes.
                  result = remove(response.content)
                  cutout = Image.open(BytesIO(result)).convert('RGBA')
                  bbox = cutout.getbbox()
                  if not bbox:
                      continue
                  cutout = cutout.crop(bbox)
                  if cutout.width < 120 or cutout.height < 100:
                      continue
                  margin = 28
                  canvas = Image.new('RGBA', (cutout.width + margin*2, cutout.height + margin*2), (0,0,0,0))
                  canvas.alpha_composite(cutout, (margin, margin))
                  if canvas.getchannel('A').getextrema()[0] != 0:
                      continue
                  name = f'attack-shark-x1-{len(saved)+1}.png'
                  canvas.save(out_dir / name, optimize=True)
                  saved.append('/assets/x1/' + name)
                  if len(saved) >= 4:
                      break
              except Exception as exc:
                  print(f'skipping {url}: {exc}')

          if not saved:
              raise SystemExit('No usable white X1 mouse-only image could be generated.')

          while len(saved) < 4:
              source = Path('public' + saved[-1])
              target_name = f'attack-shark-x1-{len(saved)+1}.png'
              target = out_dir / target_name
              target.write_bytes(source.read_bytes())
              saved.append('/assets/x1/' + target_name)

          Path('public/assets/x1/manifest.json').write_text(json.dumps({'images': saved}, indent=2))
          print('Generated:', saved)
          PY

      - name: Add X1 gallery and independent text size control
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()

          text = text.replace(
              'import { CircleHelp, Gauge, Gamepad2, ImagePlus, Keyboard, Mouse, Palette, RefreshCw, Settings, SlidersHorizontal, Upload, Zap } from "lucide-react";',
              'import { ChevronLeft, ChevronRight, CircleHelp, Gauge, Gamepad2, ImagePlus, Keyboard, Mouse, Palette, RefreshCw, Settings, SlidersHorizontal, Upload, Zap } from "lucide-react";'
          )

          anchor = '  const [polling, setPolling] = useState("1000 Hz");\n'
          if 'textScale' not in text:
              text = text.replace(anchor, anchor + '  const [textScale, setTextScale] = useState(() => Number(localStorage.getItem("unnamed-text-scale") || 100));\n', 1)
          if 'mouseAssetIndex' not in text:
              text = text.replace(anchor, anchor + '  const [mouseAssetIndex, setMouseAssetIndex] = useState(() => Number(localStorage.getItem("unnamed-x1-image-index") || 0));\n  const mouseAssets = ["/assets/x1/attack-shark-x1-1.png", "/assets/x1/attack-shark-x1-2.png", "/assets/x1/attack-shark-x1-3.png", "/assets/x1/attack-shark-x1-4.png"];\n', 1)

          anchor = '  useEffect(() => () => { if (dpiTimer.current) clearTimeout(dpiTimer.current); }, []);\n'
          if 'unnamed-text-scale' not in text:
              text = text.replace(anchor, anchor + '  useEffect(() => { localStorage.setItem("unnamed-text-scale", String(textScale)); localStorage.setItem("unnamed-x1-image-index", String(mouseAssetIndex)); }, [textScale, mouseAssetIndex]);\n', 1)

          old = '<div className="mouse-illustration"><img src="/assets/attack-shark-x1.png" alt="White Attack Shark X1" onError={e => { e.currentTarget.style.display = "none"; }}/></div>'
          new = '<div className="mouse-illustration"><button className="mouse-image-arrow left" type="button" aria-label="Previous mouse image" onClick={() => setMouseAssetIndex(i => (i - 1 + mouseAssets.length) % mouseAssets.length)}><ChevronLeft size={18}/></button><img src={mouseAssets[mouseAssetIndex % mouseAssets.length]} alt="White Attack Shark X1"/><button className="mouse-image-arrow right" type="button" aria-label="Next mouse image" onClick={() => setMouseAssetIndex(i => (i + 1) % mouseAssets.length)}><ChevronRight size={18}/></button><div className="mouse-image-count">{(mouseAssetIndex % mouseAssets.length) + 1} / {mouseAssets.length}</div></div>'
          if old in text:
              text = text.replace(old, new, 1)

          if 'Text size' not in text:
              settings_anchor = '<div className="scale-presets">'
              first = text.find(settings_anchor)
              if first != -1:
                  end = text.find('</div>', first)
                  insert_at = end + len('</div>') if end != -1 else -1
                  if insert_at != -1:
                      control = '<div className="scale-control text-scale-control"><span>Text size</span><input type="range" min="85" max="140" step="5" value={textScale} onChange={e => setTextScale(Number(e.target.value))}/><b className="scale-value">{textScale}%</b></div><div className="scale-presets">{[90,100,110,120,130,140].map(v => <button className={textScale === v ? "selected" : ""} key={v} onClick={() => setTextScale(v)} type="button">{v}%</button>)}</div>'
                      text = text[:insert_at] + control + text[insert_at:]

          text = text.replace('"--glass-radius": `${glassRadius}px`', '"--glass-radius": `${glassRadius}px`, "--text-scale": String(textScale / 100)')
          p.write_text(text)
          PY

      - name: Style gallery and text scaling
        run: |
          cat >> src/appearance.css <<'CSS'

          .ui-scale-layer{font-size:calc(1em * var(--text-scale,1));}
          .ui-scale-layer h1{font-size:calc(22px * var(--text-scale,1));}
          .ui-scale-layer h2{font-size:calc(15px * var(--text-scale,1));}
          .ui-scale-layer p,.ui-scale-layer button,.ui-scale-layer select,.ui-scale-layer input,.ui-scale-layer label,.ui-scale-layer span,.ui-scale-layer small,.ui-scale-layer strong,.ui-scale-layer .eyebrow,.ui-scale-layer .device-meta{font-size:calc(1em * var(--text-scale,1));}
          .text-scale-control{margin-top:12px;}
          .mouse-illustration{position:relative;display:flex;align-items:center;justify-content:center;overflow:visible;padding:8px 38px;}
          .mouse-illustration img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 28px rgba(0,0,0,.22));}
          .mouse-image-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(20,22,26,.55);color:rgba(255,255,255,.78);backdrop-filter:blur(12px);cursor:pointer;}
          .mouse-image-arrow:hover{background:rgba(30,33,39,.78);border-color:rgba(255,255,255,.3);color:#fff;}
          .mouse-image-arrow.left{left:2px;}.mouse-image-arrow.right{right:2px;}
          .mouse-image-count{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(255,255,255,.55);padding:3px 6px;border:1px solid rgba(255,255,255,.12);background:rgba(16,18,22,.42);border-radius:999px;backdrop-filter:blur(10px);}
          CSS

      - name: Commit gallery and app changes safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/x1 src/App.tsx src/appearance.css
          git diff --cached --quiet && exit 0
          git commit -m 'Fix X1 background removal and text size control'
          git pull --rebase origin main
          git push origin HEAD:main
