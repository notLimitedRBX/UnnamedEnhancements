name: Build Unnamed Enhancements Downloader

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the downloader
        required: true
        default: dpi-diagnostics
        type: string

concurrency:
  group: downloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-downloader:
    name: Build Downloader for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Tauri build cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.toml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build downloader
        run: npm run downloader:build

      - name: Prepare portable downloader
        shell: pwsh
        run: |
          $source = Get-ChildItem "src-tauri/target/release" -Filter "*.exe" | Select-Object -First 1
          if (-not $source) { throw "Portable downloader executable was not created." }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item -LiteralPath $source.FullName -Destination "release/UnnamedEnhancements-Downloader.exe"

      - name: Upload portable downloader
        uses: actions/upload-artifact@v4
        with:
          name: UnnamedEnhancements-Downloader-Windows
          path: release/UnnamedEnhancements-Downloader.exe
          compression-level: 9
