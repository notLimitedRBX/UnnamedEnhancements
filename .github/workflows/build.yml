name: Build Unnamed Enhancements Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the app changes
        required: true
        default: dpi-diagnostics
        type: string
  push:
    branches:
      - dpi-diagnostics
    paths:
      - index.html
      - src/**
      - src-tauri/**
      - package.json
      - vite.config.ts
      - public-app/**
      - .github/workflows/build.yml

concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build Portable Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Tauri build cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.toml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build portable app
        run: npm run tauri build

      - name: Stage portable app
        shell: pwsh
        run: |
          $app = Get-ChildItem "src-tauri/target/release" -Filter "*.exe" | Select-Object -First 1
          if (-not $app) { throw "Portable app executable was not created." }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item -LiteralPath $app.FullName -Destination "release/UnnamedEnhancements.exe"

      - name: Build custom downloader
        run: npm run downloader:build

      - name: Add downloader to Preview bundle
        shell: pwsh
        run: |
          $downloader = Get-ChildItem "src-tauri/target/release" -Filter "*.exe" | Select-Object -First 1
          if (-not $downloader) { throw "Custom downloader executable was not created." }
          Copy-Item -LiteralPath $downloader.FullName -Destination "release/UnnamedEnhancements-Downloader.exe"
          Get-ChildItem "release"

      - name: Upload Preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: UnnamedEnhancements-Preview-Windows
          path: release
          compression-level: 9
