name: Publish Unnamed Enhancements

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish
        required: true
        default: dpi-diagnostics
        type: string
      version:
        description: Release version (for example 0.1.0)
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: write

jobs:
  publish-windows-app:
    name: Publish Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run tauri build

      - name: Prepare portable app file
        shell: pwsh
        run: |
          $app = Get-ChildItem "src-tauri/target/release" -Filter "*.exe" | Select-Object -First 1
          if (-not $app) { throw "Could not find the built app executable." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $app.FullName "release/UnnamedEnhancements.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Unnamed Enhancements v${{ inputs.version }}
          generate_release_notes: true
          files: release/UnnamedEnhancements.exe
