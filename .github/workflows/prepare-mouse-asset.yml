name: Prepare Attack Shark X1 asset

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-mouse-asset.yml

permissions:
  contents: write

jobs:
  prepare-mouse-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official X1 reference image
        run: |
          mkdir -p public/assets
          curl -L --fail --retry 3 \
            'https://attackshark.com/cdn/shop/files/X1_3_ce7e8143-8241-4e02-b881-65faace74e4c.png?v=1778225959&width=2048' \
            -o /tmp/x1-source.png

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Keep transparent source or remove studio background
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open('/tmp/x1-source.png').convert('RGBA')

          # If the manufacturer's PNG is already transparent, preserve it.
          # Otherwise remove only the connected near-white studio background.
          alpha = source.getchannel('A')
          if alpha.getextrema() == (255, 255):
              pixels = source.load()
              w, h = source.size
              seen = set()
              stack = []
              for x in range(w):
                  stack.extend(((x, 0), (x, h - 1)))
              for y in range(h):
                  stack.extend(((0, y), (w - 1, y)))

              while stack:
                  x, y = stack.pop()
                  if (x, y) in seen or not (0 <= x < w and 0 <= y < h):
                      continue
                  r, g, b, _ = pixels[x, y]
                  if min(r, g, b) < 228 or max(r, g, b) - min(r, g, b) > 14:
                      continue
                  seen.add((x, y))
                  stack.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1)))

              for x, y in seen:
                  pixels[x, y] = (255, 255, 255, 0)

          bbox = source.getbbox()
          if bbox:
              source = source.crop(bbox)

          margin = 24
          out = Image.new('RGBA', (source.width + margin*2, source.height + margin*2), (0,0,0,0))
          out.alpha_composite(source, (margin, margin))
          Path('public/assets').mkdir(parents=True, exist_ok=True)
          out.save('public/assets/attack-shark-x1.png', optimize=True)
          PY

      - name: Commit generated asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/attack-shark-x1.png
          git diff --cached --quiet || git commit -m 'Add transparent Attack Shark X1 asset'
          git push
