name: Build transparent Attack Shark X1 mouse asset

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-x1-mouse.yml

permissions:
  contents: write

jobs:
  build-x1-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download white X1 mouse reference
        run: |
          curl -L --fail --retry 3 'https://images.kabum.com.br/produtos/fotos/904343/mouse-gamer-sem-fio-attack-shark-x1-lightweight-white_1767959677_gg.jpg' -o /tmp/x1.jpg

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Isolate mouse and create transparent PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          im = Image.open('/tmp/x1.jpg').convert('RGBA')
          w, h = im.size
          p = im.load()

          # Flood-fill only the near-white background connected to the edges.
          seen = set()
          stack = [(x,0) for x in range(w)] + [(x,h-1) for x in range(w)] + [(0,y) for y in range(h)] + [(w-1,y) for y in range(h)]
          while stack:
              x,y = stack.pop()
              if (x,y) in seen or x < 0 or y < 0 or x >= w or y >= h:
                  continue
              r,g,b,a = p[x,y]
              if min(r,g,b) < 225 or max(r,g,b)-min(r,g,b) > 16:
                  continue
              seen.add((x,y))
              stack.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1)))
          for x,y in seen:
              p[x,y] = (255,255,255,0)

          # The reference has a tiny cable/plug at the far left. Remove the
          # protruding cable while retaining the X1 shell and front edge.
          mask = Image.new('L', (w,h), 0)
          m = mask.load()
          for y in range(275, 335):
              for x in range(0, 52):
                  if y > 292 + int(x * 0.18):
                      m[x,y] = 255
          blank = Image.new('RGBA', (w,h), (0,0,0,0))
          im = Image.composite(blank, im, mask)

          bbox = im.getbbox()
          if not bbox:
              raise RuntimeError('X1 isolation failed')
          im = im.crop(bbox)

          margin = 32
          out = Image.new('RGBA', (im.width+margin*2, im.height+margin*2), (0,0,0,0))
          out.alpha_composite(im, (margin,margin))
          Path('public/assets').mkdir(parents=True, exist_ok=True)
          out.save('public/assets/attack-shark-x1.png', optimize=True)

          if out.getchannel('A').getextrema()[0] != 0:
              raise RuntimeError('Output is not transparent')
          PY

      - name: Commit asset into app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/attack-shark-x1.png
          git diff --cached --quiet || git commit -m 'Add isolated transparent white Attack Shark X1'
          git push
